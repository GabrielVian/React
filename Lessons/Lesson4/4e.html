<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
    <style>
      
    </style>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function App(){
        const [isShowingPass, setIsShowingPass] = React.useState(false) 
        return (
          <>
            <LoginForm 
              isShowingPass={isShowingPass}
              setIsShowingPass={setIsShowingPass}
            />
          </>
        )
      }

      function LoginForm({isShowingPass, setIsShowingPass}){
        function handleOnClickShow(){
          setIsShowingPass(!isShowingPass)
        }

        return (
          <>
            <div>
              <h1>Hello, welcome to my website</h1>
            </div>
            <div className="inputs-container">
              <div>
                <input type="text" placeholder="Email" className="form-input" />
              </div>

              <div>
                <input 
                  type={isShowingPass ? "text" : "password"} 
                  placeholder="Password" 
                  className="form-input" 
                />
                <button onClick={handleOnClickShow}>{isShowingPass ? 'Hide' : 'Show'}</button>
              </div>
            </div>
            <div className="button-container">
              <button> Login </button>
              <button> Sing up </button>
            </div>
          </>
         )
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
