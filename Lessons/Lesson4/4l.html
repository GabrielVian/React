<!DOCTYPE html>
<html>
  <head>
    <title>Chat Bot</title>
    <style>
      *{
        font-family:Arial, Helvetica, sans-serif ;
      }

      .send-button {
        background-color: #198653;
        color: white;
        padding: 12px 20px;
        margin-left: 10px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
      }
      .input-text{
        padding: 12px 20px;
        border-radius: 10px;
        border: solid;
        border-width: 1px;
        flex-grow: 1;
      }
      .text-container{
        display: flex;
        margin-bottom: 60px;

      }
      .message-conteiner-bot, .message-conteiner-user{
        display: flex;
        margin-top: 20px;
      }
      .message-conteiner-user{
        justify-content: end;
      }

      .message{
        align-self: baseline;
        max-width: 400px;
      }

      .message-conteiner-bot .message{
        display: flex;
        background-color: rgb(132, 10, 10);
        color: white;
        border-radius: 10px;
        padding: 16px 20px;
        margin-left: 10px;
        margin-right: 10px;
      }
      .message-conteiner-user .message{
        display: flex;
        background-color: rgb(237, 237, 237);
        border-radius: 10px;
        padding: 12px 20px;
        margin-left: 10px;
        margin-right: 10px;
      }
      .app-container{
        max-width: 80vw;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .message-conteiner-bot img, .message-conteiner-user img{
        width: 45px;
        height: 45px;
      }
      body{
        margin-top: 0px;
        margin-bottom: 0px;
      }
      .chat-container{
        flex-grow: 1;
        margin-top: 20px;
        margin-bottom: 20px;
        overflow: scroll;
        scrollbar-width: none;
        text-align: center;
      }
      .noMessage{
        color: rgb(164, 164, 164);
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function ChatInput({chatMessages, setChatMessages, isLoading, setIsLoading}) {

        const [inputText, setInputText] = React.useState('');

        function saveInputText(event){
          setInputText(event.target.value)
        }

        async function sendMessage() {
          if(isLoading){
            alert("Robot is thinking")
            return;
          }
          if(inputText === '') {
            alert("Empty text input")
            return;
          }
          setInputText('');
          const newChatMessages = [
            ...chatMessages,
            {
              message: inputText,
              sender: 'user',
              id: crypto.randomUUID()
            }
          ]
          setChatMessages(newChatMessages);

          const loadingChatMessages = newChatMessages
          setChatMessages([
            ...loadingChatMessages,
            {
              message: "",
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);
          setIsLoading(true);

          const response = await Chatbot.getResponseAsync(inputText);
          
          setIsLoading(false);
          setChatMessages([
            ...newChatMessages,
            {
              message: response,
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);

        }

        function handleKeyDown(event){
          if(event.key === 'Enter')
            sendMessage()
          if(event.key === 'Escape')
            setInputText('')
        }

        return (
          <div className='text-container'>
            <input 
              placeholder="Send a message to ChatBot" 
              size="30" 
              onChange={saveInputText}
              value={inputText}
              onKeyDown={handleKeyDown}
              className='input-text'
            /> 
            <button 
              onClick={sendMessage} 
              className='send-button'
            >Send</button>
          </div>
        );
      }
 
      function ChatMessage({message, sender, isLoading}) {

        return (
          <div className={sender === 'robot'  
                          ? 'message-conteiner-bot' 
                          : 'message-conteiner-user'}>
            {sender === "robot" && (
              <img 
                src="/Images/robot.png" 
                alt="Robot" 
                width="50"
                height="50" 
              />
            )}
            <div className='message'>
              {isLoading && message==="" ? (
                <img 
                  src="/Images/loading-spinner.gif" 
                  alt="Loading" 
                />
              ) : ""}
              {message}
            </div>
            {sender === "user" && (
              <img 
                src="/Images/user.png" 
                alt="User" 
                width="50" 
                height="50" 
              />
            )}
          </div>
        );
      }

      function ChatMessages({chatMessages, isLoading, setIsLoading}){
        // const chatMessagesRef = React.useRef(null);

        // React.useEffect(() => {
        //   const containerElem = chatMessagesRef.current
        //   if(containerElem){
        //     containerElem.scrollTop = containerElem.scrollHeight;
        //   }
        // }, [chatMessages]);

        const chatMessagesRef = useAutoScroll(chatMessages);

        return (
          <div className='chat-container' ref={chatMessagesRef} >
            {chatMessages.map((chatMessage) => {
                  return (
                    <ChatMessage 
                      message={chatMessage.message}
                      sender={chatMessage.sender}
                      isLoading={isLoading}
                      key={chatMessage.id}
                    />
                  )
            })}
            <div className='noMessage'>
              {chatMessages.length === 0 ? "Welcome to the chatbot project! Send a message using the textbox bellow" : ""}
            </div>
          </div>
        )
      }

      function useAutoScroll(dependencies){
        const chatMessagesRef = React.useRef(null);

        React.useEffect(() => {
          const containerElem = chatMessagesRef.current
          if(containerElem){
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        }, [dependencies]);

        return chatMessagesRef;
      }

      function App(){
        const [chatMessages, setChatMessages] = React.useState([]);
        const [isLoading, setIsLoading] = React.useState(false);
        // const [chatMessages, setChatMessages] = array;
        // const chatMessages = array[0];
        // const setChatMessages = array[1];


        return (
          <div className="app-container">
            <ChatMessages 
              chatMessages={chatMessages}
              isLoading={isLoading}
              setIsLoading={setIsLoading}
            />
            <ChatInput 
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
              isLoading={isLoading}
              setIsLoading={setIsLoading}
              />
          </div>
        );  
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
