<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ProductDetails({name, price, discountPrice}){
        return (
          <>
            <div>
              <p>{name}</p>
            </div>
            
            <div>
              {discountPrice ? (
                <del>Price: ${price.toFixed(2)}</del>
              ) 
              :<p>Price: ${price.toFixed(2)}</p>}
            </div>

            {discountPrice && (
              <div>
                <p>Discount Price: ${discountPrice.toFixed(2)}</p>
              </div>
            )}

            <div>
              <button> Add to Cart </button>
            </div>
          </>
        )
      }


      function App(){
        return (
          <>
          <ProductDetails name="Socks" price={7.99} />
            <ProductDetails name="Tennis Balls" price={6} />
            <ProductDetails name="Plain T-Shirts" price={7.99} discountPrice={5.99} />
          </>
        )
        
      }
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
