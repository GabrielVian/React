<!DOCTYPE html>
<html>
  <head>
    <title>Chat Bot</title>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function ChatInput() {
        return (
          <>
            <input 
              placeholder="Senda a message to ChatBot" 
              size="30" 
            /> 
            <button>Send</button>
          </>
        );
      }
 
      function ChatMessage({message, sender}) {

        return (
          <div>
            {sender === "robot" && (
              <img 
                src="Images/robot.png" 
                alt="Robot" 
                width="50"
                height="50" 
              />
            )}
            {message}
            {sender === "user" && (
              <img 
                src="Images/user.png" 
                alt="User" 
                width="50" 
                height="50" 
              />
            )}
          </div>
        );
      }


      function App(){
        const chatMessages = [
          {message: "Hello Chatbot", sender: "user", id:"1"},
          {message: "How are you?", sender: "robot", id:"2"},
          {message: "What is your name?", sender: "user", id:"3"},
          {message: "Nice to meet you!", sender: "robot", id:"4"}
        ];
        return (
          <>
            <ChatInput />
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage 
                  message={chatMessage.message} 
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              )
            })}
          </>
        );  
      }

      // const app = (
      //   <>
      //     <ChatInput />

      //       message="Hello Chatbot" 
      //       sender="user" 
      //     />
      //     <ChatMessage 
      //       message="How are you?" 
      //       sender="robot" 
      //     />
      //     <ChatMessage 
      //       message="What is your name?" 
      //       sender="user" 
      //     />
      //     <ChatMessage 
      //       message="Nice to meet you!" 
      //       sender="robot" 
      //     />

      //   </>
      // );

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
