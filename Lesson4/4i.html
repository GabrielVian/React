<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <style>
    .container{
      display: flex;
      gap: 5px;
      justify-content: center;
      height: 100vh;
      background-color: aliceblue;
      margin-top: 0px;
      margin-bottom: 0px;
      align-items: center;
    }
    .container button{
      background-color: rgb(25, 135, 84);
      padding: 20px;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      border: none;     
       
    }
  </style>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        
        function Button(){
          const [count, setCount] = React.useState(0);
          const buttonRef = React.useRef(null);


          function handleClick(){
              setCount(count+1);
          }

          function handleClickReset(){
              setCount(0);
          }

          function handleClickAutoClick(){
              setInterval(() => {
                const buttonElem = buttonRef.current;
                if (buttonElem) {
                  buttonElem.click();
                }
              }, 1000)
          }

          return (
            <div className='container'>
              <button onClick={handleClick} ref={buttonRef}>Clicked {count} 
                {count == 1 && ' time'}
                {count != 1 && ' times'}
              </button>
              <button onClick={handleClickReset}>Reset</button>
              <button onClick={handleClickAutoClick}>Auto Click</button>
            </div>
          )
        }


        function App(){
            return (
                <Button />
            )
        }


      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
